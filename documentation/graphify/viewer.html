<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PharmaCare · Graphify</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --pharma: #16a34a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--pharma); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
  }
  header h1 { font-size: 16px; margin: 0; }
  header small { color: var(--muted); }
  #toolbar { padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #toolbar input[type="search"] {
    flex: 1; min-width: 220px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 6px; outline: none;
  }
  #toolbar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
  }
  #toolbar button:hover { border-color: var(--pharma); color: #86efac; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 20px 0; background: var(--panel); }
  .tab {
    padding: 7px 13px; border-radius: 8px 8px 0 0; cursor: pointer;
    color: var(--muted); border: 1px solid transparent; border-bottom: none;
    font-size: 13px;
  }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--line); }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  main { flex: 1; overflow: auto; padding: 20px; }
  .graph-card { display: none; max-width: 1500px; margin: 0 auto; }
  .graph-card.active { display: block; }
  .graph-card h2 { margin: 0 0 4px; font-size: 20px; }
  .graph-card .desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.55; }
  .graph-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .graph-card .meta code { color: #7dd3fc; }
  .graph-host { background: #fff; border-radius: 10px; padding: 16px; overflow-x: auto; min-height: 420px; }
  .graph-host.selected svg { margin: 0 auto; display: block; }
  .graph-host .err { color: #b91c1c; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  .graph-host pre.raw { color: #1e293b; font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  footer { padding: 10px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  a.filelink { color: #7dd3fc; }
</style>
</head>
<body>
<header>
  <div class="logo">PC</div>
  <div>
    <h1>PharmaCare — Graphify Architecture</h1>
    <small>Generated locally from the actual source code · regenerated by <code>npm run graphify</code></small>
  </div>
</header>

<div id="toolbar">
  <input type="search" id="search" placeholder="Filter graphs… (e.g. erd, auth, sales)" />
  <button id="btn-expand">Expand / collapse all</button>
  <button id="btn-print">Print</button>
</div>

<div id="tabs"></div>

<main id="main"></main>

  "file": "graphs/auth-flow.md",
  "mermaid": "flowchart TB\nclassDef ui fill:#f0fdf4,stroke:#16a34a,color:#14532d\nclassDef auth fill:#fff7ed,stroke:#ea580c,color:#7c2d12\nclassDef mw fill:#fef2f2,stroke:#dc2626,color:#7f1d1d\nclassDef data fill:#fdf4ff,stroke:#a21caf,color:#701a75\nclassDef page fill:#eff6ff,stroke:#2563eb,color:#1e3a8a\nclassDef note fill:#f8fafc,stroke:#94a3b8,color:#334155\n\nsubgraph UI[\"1 · Login page (Client)\"]\n  U1[\"LoginForm component — email + password inputs\"]:::ui\n  U2[\"React form validation (Zod)\"]:::ui\n  U3[\"POST to /api/auth/csrf then signIn('credentials', ...)\"]:::ui\nend\n\nsubgraph AUTH[\"2 · NextAuth Credentials provider (Server)\"]\n  A1[\"/api/auth/[…nextauth]/route.ts — auth-config.ts\"]:::auth\n  A2[\"authorize({email, password})\"]:::auth\n  A3{\"User found?\"}:::auth\n  A4{\"isActive?\"}:::auth\n  A5{\"Account locked?\\n(lockedUntil > now)\"}:::auth\n  A6{\"Password valid?\\nbcrypt.compare\"}:::auth\n  A7[\"OK → reset failedLoginCount · set lastLoginAt\"]:::auth\n  A8[\"FAIL → increment failedLoginCount\\nlock for 15 min if count ≥ 4\\n(coalesced: locks on 5th failure)\"]:::auth\n  A9[\"Return JWT-safe payload\\n{id, name, email, image, permissions[], roles[], branchId}\"]:::auth\nend\n\nsubgraph JWT[\"3 · Session (JWT strategy, 30-day maxAge)\"]\n  J1[\"jwt() callback — embeds id · permissions · roles · branchId on token\"]:::auth\n  J2[\"session() callback — copies to session.user.*\"]:::auth\n  J3[\"Prisma adapter linked (accounts, sessions tables exist) but strategy = JWT\"]:::auth\nend\n\nsubgraph MW[\"4 · Middleware (every protected route)\"]\n  M1[\"src/middleware.ts — NextAuth withAuth()\"]:::mw\n  M2{\"token present?\"}:::mw\n  M3{\"pathname starts with /pos ?\"}:::mw\n  M4{\"token.permissions includes sales:create?\"}:::mw\n  M5[\"next()\"]:::mw\n  M6[\"redirect → /login\"]:::mw\n  M7[\"redirect → / (deny POS access)\"]:::mw\nend\n\nsubgraph SERVER[\"5 · Server Components + API routes\"]\n  S1[\"Dashboard layout — getServerSession(auth <script>
  (function () {
    var payload = JSON.parse(document.getElementById('graphify-payload').textContent);
    var generatedAt = '2026-09-14';

    document.getElementById('generated').textContent = generatedAt;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      er: { useMaxWidth: true },
      themeVariables: {
        fontFamily: 'ui-sans-serif, system-ui, sans-serif',
        primaryColor: '#f0fdf4',
        primaryTextColor: '#14532d',
        primaryBorderColor: '#16a34a',
        lineColor: '#94a3b8',
        secondaryColor: '#eff6ff',
        tertiaryColor: '#fafafa',
        actorBkg: '#eff6ff',
      },
    });

    var groups = [];
    payload.forEach(function (g) {
      if (groups.indexOf(g.group) === -1) groups.push(g.group);
    });

    var tabEl = document.getElementById('tabs');
    var mainEl = document.getElementById('main');

    groups.forEach(function (group) {
      var t = document.createElement('div');
      t.className = 'tab';
      t.dataset.group = group;
      t.textContent = group;
      t.addEventListener('click', function () {
        activateGroup(group);
      });
      tabEl.appendChild(t);
    });

    function cardsForGroup(group) {
      return payload
        .filter(function (g) { return g.group === group; })
        .slice()
        .sort(function (a, b) { return a.groupOrder - b.groupOrder; });
    }

    function activateGroup(group) {
      Array.prototype.forEach.call(tabEl.children, function (el) {
        el.classList.toggle('active', el.dataset.group === group);
      });
      mainEl.innerHTML = '';
      cardsForGroup(group).forEach(function (g) {
        renderCard(mainEl, g);
      });
    }

    function renderCard(host, g) {
      var card = document.createElement('section');
      card.className = 'graph-card active';
      card.dataset.id = g.id;

      var h = document.createElement('h2');
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = g.accent || '#16a34a';
      h.appendChild(dot);
      h.appendChild(document.createTextNode(g.title));
      card.appendChild(h);

      var desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = g.description || '';
      card.appendChild(desc);

      var meta = document.createElement('p');
      meta.className = 'meta';
      meta.innerHTML = 'Source: <code>' + g.sourceFiles.join(', ') + '</code> · Markdown: <a class="filelink" target="_blank" href="graphs/' + g.id + '.md">graphs/' + g.id + '.md</a>';
      card.appendChild(meta);

      var box = document.createElement('div');
      box.className = 'graph-host';
      box.setAttribute('data-graph', g.id);
      card.appendChild(box);

      host.appendChild(card);

      renderMermaid(box, g);
    }

    var rendering = {};
    function renderMermaid(box, g) {
      if (rendering[g.id]) return;
      rendering[g.id] = true;
      var code = g.mermaid;
      mermaid.render('mmd-' + g.id.replace(/[^a-zA-Z0-9]/g, '_'), code)
        .then(function (res) {
          box.innerHTML = res.svg;
        })
        .catch(function (err) {
          box.innerHTML = '';
          var e = document.createElement('pre');
          e.className = 'err';
          e.textContent = 'Mermaid render error: ' + (err && err.message ? err.message : String(err));
          box.appendChild(e);
          var raw = document.createElement('pre');
          raw.className = 'raw';
          raw.textContent = code;
          box.appendChild(raw);
        });
    }

    // initial tab
    if (groups.length) activateGroup(groups[0]);

    // search filter
    var search = document.getElementById('search');
    var btnExpand = document.getElementById('btn-expand');
    var btnPrint = document.getElementById('btn-print');

    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(mainEl.querySelectorAll('.graph-card'), function (card) {
        var match = card.textContent.toLowerCase().indexOf(q) !== -1 || card.dataset.id.indexOf(q) !== -1;
        card.style.display = match ? 'block' : 'none';
      });
    });

    btnExpand.addEventListener('click', function () {
      mainEl.querySelectorAll('.graph-host svg').forEach(function (svg) {
        if (svg.style.maxWidth === 'none') svg.style.maxWidth = '';
        else svg.style.maxWidth = 'none';
      });
    });

    btnPrint.addEventListener('click', function () {
      window.print();
    });
  })();
</script>
